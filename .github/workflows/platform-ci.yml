name: Platform CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'infra-platform/**'
      - 'shared/**'
      - '.github/workflows/platform-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'infra-platform/**'
      - 'shared/**'

jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, test, stage, prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      - name: Terraform Format Check
        working-directory: infra-platform/terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: infra-platform/terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infra-platform/terraform/environments/${{ matrix.environment }}
        run: terraform validate

  scripts-test:
    name: Test Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on platform scripts
        run: |
          find infra-platform/scripts -name "*.sh" -type f -exec shellcheck {} \; || true

      - name: Test shared scripts sourcing
        run: |
          bash -c "source shared/scripts/common.sh && print_version"

